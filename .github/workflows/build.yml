name: Build & Release Packages

# 仅手动触发：Actions 页面 → 本工作流 → Run workflow。
# 已关闭 push 自动触发（原设计为「推送 v* 标签」或「master 上 PKG_VERSION 变化」
# 时自动编译发版），避免版本号一改动就自动出包、自动建 tag 与 Release。
#
# 产物：OpenWrt 25.12（apk 包格式）
#   luci-app-natmap-<ver>-r<rel>.apk        界面与脚本，PKGARCH=all，架构无关
#   luci-i18n-natmap-zh-cn                 简体中文翻译，架构无关
#
# tag 规则：v<PKG_VERSION>-r<PKG_RELEASE>，与包的完整版本一一对应。
#   PKG_VERSION 不变、只升 PKG_RELEASE（修 bug / 改安装产物）也会得到新 tag，
#   因此无需为了发新版而强行推 PKG_VERSION。详见仓库根目录 README 的版本号约定。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PKG_VERSION（不含 v 前缀；留空则读取 Makefile）'
        required: false
        type: string
      release:
        description: 'PKG_RELEASE（纯数字，如 2；留空则读取 Makefile）。修 bug 只升 PKG_RELEASE 即可发新版'
        required: false
        type: string
      force:
        description: '即使该版本 tag 已存在，也重新编译并覆盖 Release 资产'
        required: false
        type: boolean
        default: false

# 需要写权限：创建 tag、创建 Release、上传资产
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 编译用 SDK。x86_64 仅决定用哪个 SDK，产物是 PKGARCH=all 的架构无关包。
  # 如需 ipk（OpenWrt 24.10 及更早），改成 x86_64-24.10.7 并将下面的 .apk 换成 .ipk。
  SDK_ARCH: x86_64-25.12.5
  # 本仓库同时被挂载为 SDK 的一个 feed，此名即输出目录名
  FEED_NAME: natmap
  # 要编译的包目录。luci-i18n-natmap-* 翻译包在同一个目录里定义，编译它会一并产出。
  BUILD_PACKAGES: luci-app-natmap
  # 版本号来源。本仓库为扁平布局：包定义（Makefile）就在仓库根目录
  PKG_MAKEFILE: Makefile

jobs:
  prepare:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      need_tag: ${{ steps.resolve.outputs.need_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算 tag 并判断是否需要构建
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu

          if [ "$REF_TYPE" = "tag" ]; then
            # 由 tag 触发：tag 名即版本，形如 v1.5.10-r2
            TAG="$REF_NAME"
            NEED_TAG=false
          else
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION="$(sed -n 's/^PKG_VERSION:=//p' "$PKG_MAKEFILE" | head -n 1)"
            fi
            if [ -n "${INPUT_RELEASE}" ]; then
              RELEASE="${INPUT_RELEASE#r}"
            else
              RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' "$PKG_MAKEFILE" | head -n 1)"
            fi
            if [ -z "$VERSION" ]; then
              echo "::error::无法从 $PKG_MAKEFILE 读取 PKG_VERSION"
              exit 1
            fi
            if [ -z "$RELEASE" ]; then
              echo "::error::无法从 $PKG_MAKEFILE 读取 PKG_RELEASE"
              exit 1
            fi
            # 完整包版本 = PKG_VERSION-PKG_RELEASE。tag 必须带上 -r，
            # 否则修 bug 只升 PKG_RELEASE 时 tag 不变、会被当成「版本没动」跳过。
            TAG="v${VERSION}-r${RELEASE}"
            NEED_TAG=true
          fi

          BUILD=true
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在"
            if [ "$NEED_TAG" = "true" ] && [ "$FORCE" != "true" ]; then
              echo "tag ${TAG} 已存在（PKG_VERSION 与 PKG_RELEASE 均未变），跳过本次构建（如需重建请勾选 force）"
              BUILD=false
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "need_tag=${NEED_TAG}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "=> tag=${TAG} build=${BUILD} need_tag=${NEED_TAG}"

  build:
    name: 编译 apk
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet /usr/share/swift
          df -h / | tail -n 1

      # 本仓库是扁平布局（Makefile/htdocs/po/root 都在根目录），而 OpenWrt 的 feed
      # 扫描（`find feeds/<名> -mindepth 1 -name Makefile`）只认 feed 根目录下的
      # 一级子目录，根目录自身的 Makefile 不算一个包。
      # 所以这里把代码签出到子目录 luci-app-natmap/ 里，让工作区本身成为合法的
      # feed 根目录，再通过 FEED_DIR 交给 SDK 动作挂载为 /feed。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: luci-app-natmap

      - name: 使用 OpenWrt SDK 编译
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ env.SDK_ARCH }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: ${{ env.BUILD_PACKAGES }}
          FEED_DIR: ${{ github.workspace }}
          V: s

      - name: 收集编译产物
        run: |
          mkdir -p dist

          echo "--- bin/packages 下的目录 ---"
          find bin/packages -maxdepth 3 -type d | head -n 40 || true

          # 只收集本应用与翻译包：
          #   - 编译 luci-app-natmap 时会顺带把依赖 natmap 也编译出来，它是架构相关包
          #     （本 workflow 用 x86_64 SDK），对 ARM/MIPS 设备无用，不纳入发布
          #   - 同时也避免把 SDK 自带的其它预编译包一并打进来
          find bin/packages -type f \
            \( -name 'luci-app-natmap-*.apk' -o -name 'luci-i18n-natmap-*.apk' \) \
            -exec cp -v {} dist/ \; || true

          # 兜底：按包名没匹配到时，从本仓库 feed 的输出目录收集
          if [ -z "$(ls -A dist)" ]; then
            echo "未按包名匹配到产物，改用 feed 输出目录收集"
            find bin/packages -type f -path "*/${FEED_NAME}/luci-*.apk" -exec cp -v {} dist/ \; || true
          fi

          echo "--- dist ---"
          ls -l dist/

      - name: 校验产物
        run: |
          if ! ls dist/luci-app-natmap-*.apk >/dev/null 2>&1; then
            echo "::error::没有产出 luci-app-natmap 的 apk"
            exit 1
          fi
          if ! ls dist/luci-i18n-natmap-*.apk >/dev/null 2>&1; then
            echo "::warning::没有产出 luci-i18n-natmap-* 翻译包"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: 创建并推送 tag
        if: needs.prepare.outputs.need_tag == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "${TAG}"
          fi
          git push origin "refs/tags/${TAG}"

      - name: 生成 Release 说明
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bash .github/scripts/release-notes.sh "$TAG" dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          TITLE="$(cat release-title.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖资产与说明"
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-body.md
          else
            gh release create "$TAG" dist/*.apk \
              --title "$TITLE" \
              --notes-file release-body.md \
              --verify-tag
          fi
